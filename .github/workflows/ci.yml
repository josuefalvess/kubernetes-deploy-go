name: ci
on:
  push:
    branches: [master, main]
    paths-ignore: ['k8s/**']
permissions:
  contents: write
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/kubernetes-deploy-go:${{ github.sha }}

    - name: Atualiza a imagem no manifest (GitOps)
      run: |
        sed -i "s|image: .*kubernetes-deploy-go:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/kubernetes-deploy-go:${{ github.sha }}|" k8s/deployment.yaml
        git config user.name  "github-actions"
        git config user.email "github-actions@users.noreply.github.com"
        git commit -am "deploy ${{ github.sha }} [skip ci]"
        git push
