apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-app
spec:
  replicas: 3
  selector:
    matchLabels: {app: go-app}
  template:
    metadata:
      labels: {app: go-app}
    spec:
      containers:
      - name: go-app
        image: josuefalves/kubernetes-deploy-go:8ba02b6d914f2f4248bf9b031b8e49488aea0601
        ports: [{containerPort: 80}]
